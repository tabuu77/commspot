# Runs on every push and PR: secret scanning + vulnerable dependency audit.
name: ci-security

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Gitleaks (secret scan of full history)
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.30.1 \
            git /repo --redact --no-banner --exit-code 1

  dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: "8.0.x"
      - name: Fail on known-vulnerable NuGet packages
        run: |
          shopt -s globstar nullglob
          projects=(**/*.sln)
          if [ ${#projects[@]} -eq 0 ]; then echo "No .NET solution yet, skipping."; exit 0; fi
          for p in "${projects[@]}"; do
            dotnet restore "$p"
            dotnet list "$p" package --vulnerable --include-transitive | tee audit.txt
            if grep -q 'has the following vulnerable packages' audit.txt; then
              echo "::error::Vulnerable packages found in $p"; exit 1
            fi
          done
