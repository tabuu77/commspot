# Builds the server and desktop apps and publishes them as a GitHub Release with SHA-256 checksums.
# Trigger: push a tag like v0.1.0 (or run manually with a tag name).
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.1.0)"
        required: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: "10.0.x"
      - name: Test first
        run: dotnet test CommSpot.sln -c Release
      - name: Publish
        run: |
          set -euo pipefail
          V="${TAG#v}"
          common="-c Release --self-contained -p:PublishSingleFile=true -p:DebugType=none -p:Version=$V"
          dotnet publish src/CommSpot.Server $common -r linux-x64 -o out/server
          dotnet publish src/CommSpot.Client $common -r win-x64 -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -o out/win
          dotnet publish src/CommSpot.Client $common -r linux-x64 -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -o out/linux
          find out -name '*.pdb' -delete
          mkdir dist
          tar -C out/server -czf dist/commspot-server-linux-x64.tar.gz .
          (cd out/win && zip -qr ../../dist/CommSpot-windows-x64.zip .)
          tar -C out/linux -czf dist/CommSpot-linux-x64.tar.gz .
          cp out/win/CommSpot.exe installer-input.exe
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist
          retention-days: 1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: win-exe
          path: installer-input.exe
          retention-days: 1

  installer:
    # Per-user Windows installer (Inno Setup), built from the exact exe in the zip.
    needs: build
    runs-on: windows-latest
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: win-exe
          path: in
      - name: Build installer
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force out\win, dist | Out-Null
          Move-Item in\installer-input.exe out\win\CommSpot.exe
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
            if ($LASTEXITCODE -ne 0) { throw "Inno Setup install failed" }
          }
          $v = $env:TAG.TrimStart("v")
          & $iscc "/DAppVersion=$v" "/DSourceDir=$PWD\out\win" "/DOutputDir=$PWD\dist" installer\CommSpot.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed" }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installer
          path: dist/CommSpot-Setup-x64.exe
          retention-days: 1

  release:
    needs: [build, installer]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: "10.0.x"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: installer
          path: dist
      - name: Checksums
        run: (cd dist && sha256sum * > SHA256SUMS && cat SHA256SUMS)
      - name: Signed update manifest
        env:
          COMMSPOT_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          set -euo pipefail
          [ -n "$COMMSPOT_SIGNING_KEY" ] || { echo "::error::UPDATE_SIGNING_KEY secret is missing"; exit 1; }
          tool="dotnet run --project src/CommSpot.ReleaseTool -c Release --"
          $tool manifest "$TAG" dist "https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG"
          $tool sign dist/manifest.json
          cat dist/manifest.json
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --title "The Comm-Spot $TAG" \
            --notes "Windows: run CommSpot-Setup-x64.exe (no admin needed). Server and desktop builds are also attached. Verify downloads against SHA256SUMS."
