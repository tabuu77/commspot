# CommSpot nginx site. Installed to /etc/nginx/sites-available/commspot by setup-shared-vps.sh.
# Shares nginx with Metal Covenant: this file only handles commspot.net hosts.
# Traffic arrives via Cloudflare (orange cloud); ufw only lets Cloudflare IPs reach 80/443.
# certbot --nginx adds the 443 listener and certificate lines to this file.

limit_req_zone $binary_remote_addr zone=commspot_api:10m rate=10r/s;

server {
    listen 80;
    listen [::]:80;
    server_name commspot.net www.commspot.net;

    include /etc/nginx/snippets/commspot-cloudflare-realip.conf;

    server_tokens off;
    client_max_body_size 1m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'self'; frame-ancestors 'none'" always;

    # App API and SignalR (Step 1+). WebSockets pass through Cloudflare.
    location /hub {
        limit_req zone=commspot_api burst=20 nodelay;
        proxy_pass http://127.0.0.1:5100;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 300s;
    }
    location /api/ {
        limit_req zone=commspot_api burst=20 nodelay;
        proxy_pass http://127.0.0.1:5100;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Static download page, launcher, and signed update files.
    root /srv/commspot/www;
    location / {
        limit_except GET HEAD { deny all; }
        try_files $uri $uri/ =404;
    }
}
